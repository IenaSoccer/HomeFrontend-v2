map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream iena_homefrontend_ssr {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name ienasoccer.it www.ienasoccer.it;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name ienasoccer.it www.ienasoccer.it;

  ssl_certificate_key /etc/nginx/ssl-certificates/ienasoccer.it.key;
  ssl_certificate /etc/nginx/ssl-certificates/ienasoccer.it.crt;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 20m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  location / {
    proxy_pass http://iena_homefrontend_ssr;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
  }
}