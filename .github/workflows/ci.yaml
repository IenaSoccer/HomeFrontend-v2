name: CI

on:
  pull_request:
  push:
    branches-ignore: [release, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-ssr/package-lock.json
            deploy/ssr-package-lock.json
      - run: npm install --global npm@10.9.4 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm --prefix src-ssr ci --ignore-scripts
      - run: npm run postinstall
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix src-ssr audit --omit=dev --audit-level=high
      - run: npm run build:ssr
