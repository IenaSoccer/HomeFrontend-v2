name: Deploy Quasar Application

on:
  # Run the workflow only for the intended release branches.
  push:
    branches: [ release, staging ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PM2_APP_NAME: iena-homefrontend
      PM2_INSTANCES: '2'
      SSR_PORT: '3000'

    steps:
      - uses: actions/checkout@v4

      # Set up Node.js and enable npm cache on the GitHub runner.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      # Ensure the project installs, passes linting, and builds before deployment.
      - name: Install dependencies and build assets
        run: |
          npm ci
          npm run lint
          npm run build:ssr
        
      # Connect to the remote server and update or clone the current branch.
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            # Variables and paths loaded from repository secrets.
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            REPO_SSH_URL="git@github.com:${{ github.repository }}.git"
            KEY_FILE="${{ secrets.DEPLOY_KEY_PATH }}"
            PM2_APP_NAME="${{ env.PM2_APP_NAME }}"
            PM2_INSTANCES="${{ env.PM2_INSTANCES }}"
            SSR_PORT="${{ env.SSR_PORT }}"
            RELEASES_PATH="$DEPLOY_PATH/releases"
            CURRENT_PATH="$DEPLOY_PATH/current"
            RELEASE_SHA="${{ github.sha }}"
            RELEASE_NAME="$(date +%Y%m%d%H%M%S)-$(printf '%.7s' "$RELEASE_SHA")"
            NEW_RELEASE_PATH="$RELEASES_PATH/$RELEASE_NAME"

            # Prepare the SSH configuration required to access GitHub from the server.
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            test -f "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
            chmod 644 "$HOME/.ssh/known_hosts"
            export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
            export PM2_APP_NAME
            export PM2_INSTANCES
            export SSR_PORT
            export DEPLOY_CURRENT_PATH="$CURRENT_PATH"

            # Build a fresh release in its own directory.
            mkdir -p "$RELEASES_PATH"
            git clone --depth 1 --branch "${{ github.ref_name }}" "$REPO_SSH_URL" "$NEW_RELEASE_PATH"

            # Install dependencies on the new release and build SSR output.
            cd "$NEW_RELEASE_PATH"
            npm ci
            npm run build:ssr
            mkdir -p logs

            # Atomically switch the current release symlink.
            ln -sfn "$NEW_RELEASE_PATH" "$CURRENT_PATH"

            # Start or gracefully reload the SSR app through PM2.
            if pm2 describe "$PM2_APP_NAME" >/dev/null 2>&1; then
              pm2 startOrGracefulReload "$CURRENT_PATH/deploy/ecosystem.config.cjs" --only "$PM2_APP_NAME" --update-env
            else
              pm2 start "$CURRENT_PATH/deploy/ecosystem.config.cjs" --only "$PM2_APP_NAME" --env production
            fi

            pm2 save

            # Keep the five most recent releases and remove older ones.
            cd "$RELEASES_PATH"
            ls -1dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf