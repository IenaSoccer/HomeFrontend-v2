name: Deploy SSR

on:
  push:
    branches: [release, staging]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'release' && 'production' || 'staging' }}
    env:
      PM2_APP_NAME: iena-homefrontend
      PM2_INSTANCES: '2'
      SSR_PORT: '3000'
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.USERNAME }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-ssr/package-lock.json
            deploy/ssr-package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.4 --ignore-scripts

      - name: Verify and build once
        run: |
          npm ci --ignore-scripts
          npm --prefix src-ssr ci --ignore-scripts
          npm run postinstall
          npm test
          npm audit --omit=dev --audit-level=high
          npm --prefix src-ssr audit --omit=dev --audit-level=high
          npm run build:ssr

      - name: Assemble immutable release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/ssr/deploy
          cp deploy/ecosystem.config.cjs dist/ssr/deploy/ecosystem.config.cjs
          cp deploy/ssr-package-lock.json dist/ssr/package-lock.json
          printf '{"commit":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > dist/ssr/client/deployment.json
          npm --prefix dist/ssr ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm --prefix dist/ssr audit --omit=dev --audit-level=high
          tar -C dist/ssr -czf "release-${GITHUB_SHA}.tgz" .
          sha256sum "release-${GITHUB_SHA}.tgz" > "release-${GITHUB_SHA}.tgz.sha256"

      - name: Configure verified SSH host
        shell: bash
        run: |
          set -Eeuo pipefail

          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          [[ -n "$SSH_HOST" ]] || fail "Missing SSH_HOST secret"
          [[ -n "$SSH_USER" ]] || fail "Missing USERNAME secret"
          [[ -n "$DEPLOY_PATH" ]] || fail "Missing DEPLOY_PATH secret"
          [[ -n "$SSH_PRIVATE_KEY" ]] || fail "Missing SSH_PRIVATE_KEY secret"
          [[ -n "$SSH_KNOWN_HOSTS" ]] || fail "Missing SSH_KNOWN_HOSTS secret"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || fail "SSH_HOST has an invalid format"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || fail "SSH_PORT has an invalid format"
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || fail "SSH_PORT is out of range"
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] ||
            fail "USERNAME contains unsupported characters"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] ||
            fail "DEPLOY_PATH must be an absolute Unix path"
          [[ "$DEPLOY_PATH" != *".."* && "$DEPLOY_PATH" != "/" ]] ||
            fail "DEPLOY_PATH is unsafe"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts.source"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts.source"

          ssh-keygen -y -P '' -f "$HOME/.ssh/deploy_key" >/dev/null 2>&1 ||
            fail "SSH_PRIVATE_KEY is invalid, encrypted, or not a private key"
          ssh-keygen -l -f "$HOME/.ssh/known_hosts.source" >/dev/null 2>&1 ||
            fail "SSH_KNOWN_HOSTS must contain ssh-keyscan output"

          awk '
            $1 !~ /^#/ && NF >= 3 && $2 ~ /^(ssh-|ecdsa-|sk-)/ {
              print "ienavps", $2, $3
            }
          ' "$HOME/.ssh/known_hosts.source" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F ienavps -f "$HOME/.ssh/known_hosts" >/dev/null ||
            fail "SSH_KNOWN_HOSTS contains no supported OpenSSH host key"

          {
            printf 'Host ienavps\n'
            printf '  HostName %s\n' "$SSH_HOST"
            printf '  Port %s\n' "$SSH_PORT"
            printf '  User %s\n' "$SSH_USER"
            printf '  IdentityFile %s\n' "$HOME/.ssh/deploy_key"
            printf '  UserKnownHostsFile %s\n' "$HOME/.ssh/known_hosts"
            printf '  HostKeyAlias ienavps\n'
            printf '  IdentitiesOnly yes\n'
            printf '  BatchMode yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  ConnectTimeout 15\n'
            printf '  LogLevel ERROR\n'
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Upload release
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh ienavps bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path="$1"
          mkdir -p -- "$deploy_path/incoming" "$deploy_path/releases"
          REMOTE
          scp "release-${GITHUB_SHA}.tgz" "release-${GITHUB_SHA}.tgz.sha256" \
            "ienavps:$DEPLOY_PATH/incoming/"

      - name: Activate, verify and roll back on failure
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh ienavps bash -s -- \
            "$DEPLOY_PATH" "$GITHUB_SHA" "$PM2_APP_NAME" "$PM2_INSTANCES" "$SSR_PORT" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -Eeuo pipefail

          fail() {
            echo "::error::SSR release activation failed: $1" >&2
            exit 1
          }

          deploy_path="$1"
          release_sha="$2"
          app_name="$3"
          instances="$4"
          port="$5"
          run_attempt="$6"

          [[ "$deploy_path" =~ ^/[A-Za-z0-9._/-]+$ ]] || fail "DEPLOY_PATH is invalid"
          [[ "$deploy_path" != *".."* && "$deploy_path" != "/" ]] ||
            fail "DEPLOY_PATH is unsafe"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || fail "release SHA is invalid"
          [[ "$run_attempt" =~ ^[0-9]+$ ]] || fail "run attempt is invalid"
          [[ "$instances" =~ ^[1-9][0-9]*$ ]] || fail "PM2 instance count is invalid"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] || fail "SSR port is invalid"
          (( port >= 1 && port <= 65535 )) || fail "SSR port is out of range"

          archive="$deploy_path/incoming/release-$release_sha.tgz"
          checksum="$archive.sha256"
          releases_path="$deploy_path/releases"
          current_path="$deploy_path/current"
          previous_path="$deploy_path/previous"
          new_release="$releases_path/$release_sha-$run_attempt"
          previous_release="$(readlink -f "$current_path" 2>/dev/null || true)"

          [[ -f "$archive" ]] || fail "uploaded release archive is missing"
          [[ -f "$checksum" ]] || fail "uploaded checksum file is missing"
          [[ ! -e "$new_release" && ! -L "$new_release" ]] ||
            fail "release directory already exists"
          expected_checksum="$(awk 'NF { print $1; exit }' "$checksum")"
          actual_checksum="$(sha256sum "$archive" | awk '{ print $1 }')"
          [[ "$expected_checksum" =~ ^[0-9a-f]{64}$ ]] || fail "checksum file is invalid"
          [[ "$actual_checksum" == "$expected_checksum" ]] ||
            fail "uploaded release checksum does not match"

          mkdir -p -- "$new_release/logs" || fail "cannot create release directory"
          tar -xzf "$archive" -C "$new_release" || fail "cannot extract release archive"
          [[ -f "$new_release/index.js" ]] || fail "SSR release does not contain index.js"
          [[ -f "$new_release/deploy/ecosystem.config.cjs" ]] ||
            fail "SSR release does not contain the PM2 configuration"

          if [[ -n "$previous_release" && -d "$previous_release" ]]; then
            ln -sfn "$previous_release" "$previous_path"
          fi

          next_link="$deploy_path/.current-$release_sha-$run_attempt"
          [[ ! -e "$next_link" && ! -L "$next_link" ]] ||
            fail "temporary activation symlink already exists"
          ln -s "$new_release" "$next_link" || fail "cannot create activation symlink"
          mv -Tf -- "$next_link" "$current_path" || fail "cannot activate SSR release"

          export PM2_APP_NAME="$app_name"
          export PM2_INSTANCES="$instances"
          export SSR_PORT="$port"
          export DEPLOY_CURRENT_PATH="$current_path"

          rollback() {
            if test -n "$previous_release" && test -d "$previous_release"; then
              rollback_link="$deploy_path/.rollback-$release_sha-$run_attempt"
              rm -f -- "$rollback_link"
              ln -s "$previous_release" "$rollback_link"
              mv -Tf -- "$rollback_link" "$current_path"
              pm2 startOrGracefulReload "$current_path/deploy/ecosystem.config.cjs" --only "$app_name" --update-env || true
            fi
          }
          trap rollback ERR

          if pm2 describe "$app_name" >/dev/null 2>&1; then
            pm2 startOrGracefulReload "$current_path/deploy/ecosystem.config.cjs" --only "$app_name" --update-env
          else
            pm2 start "$current_path/deploy/ecosystem.config.cjs" --only "$app_name"
          fi

          healthy=false
          for _ in {1..15}; do
            if curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:$port/" >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [[ "$healthy" != true ]]; then
            echo "::error::SSR process did not become healthy on its local port" >&2
            false
          fi
          trap - ERR
          pm2 save

          rm -f -- "$archive" "$checksum"
          mapfile -t old_releases < <(find "$releases_path" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -rn | tail -n +6 | cut -d' ' -f2-)
          for old_release in "${old_releases[@]}"; do
            test "$old_release" != "$new_release" && rm -rf -- "$old_release"
          done
          REMOTE

      - name: Verify public SSR deployment
        id: health
        shell: bash
        env:
          HEALTHCHECK_URL: ${{ vars.DEPLOYMENT_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$HEALTHCHECK_URL" ]] || {
            echo "DEPLOYMENT_URL is required." >&2
            exit 1
          }
          [[ "$HEALTHCHECK_URL" == https://* ]] || {
            echo "DEPLOYMENT_URL must use HTTPS when Basic Auth is enabled." >&2
            exit 1
          }
          [[ -n "$BASIC_AUTH_USER" ]] || {
            echo "BASIC_AUTH_USER secret is required." >&2
            exit 1
          }
          [[ -n "$BASIC_AUTH_PASS" ]] || {
            echo "BASIC_AUTH_PASS secret is required." >&2
            exit 1
          }

          curl_options=(
            --fail
            --silent
            --show-error
            --location
            --retry 5
            --retry-all-errors
            --retry-delay 3
            --max-time 20
            --basic
            --user "$BASIC_AUTH_USER:$BASIC_AUTH_PASS"
          )

          curl "${curl_options[@]}" --output /dev/null "${HEALTHCHECK_URL%/}/"
          deployment_json="$(curl "${curl_options[@]}" \
            "${HEALTHCHECK_URL%/}/deployment.json?run=$GITHUB_RUN_ID")"
          jq --exit-status --arg commit "$EXPECTED_COMMIT" \
            '.commit == $commit' <<< "$deployment_json" >/dev/null

      - name: Roll back failed public health check
        if: ${{ failure() && steps.health.outcome == 'failure' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh ienavps bash -s -- \
            "$DEPLOY_PATH" "$PM2_APP_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path="$1"
          app_name="$2"
          run_id="$3"
          run_attempt="$4"
          previous_path="$deploy_path/previous"
          current_path="$deploy_path/current"
          [[ -L "$previous_path" ]] || {
            echo "No previous SSR release is available for rollback." >&2
            exit 1
          }
          rollback_target="$(readlink -f "$previous_path")"
          [[ -d "$rollback_target" ]] || {
            echo "Previous SSR release is missing." >&2
            exit 1
          }
          rollback_link="$deploy_path/.health-rollback-$run_id-$run_attempt"
          rm -f -- "$rollback_link"
          ln -s "$rollback_target" "$rollback_link"
          mv -Tf -- "$rollback_link" "$current_path"
          export DEPLOY_CURRENT_PATH="$current_path"
          pm2 startOrGracefulReload "$current_path/deploy/ecosystem.config.cjs" \
            --only "$app_name" --update-env
          REMOTE

      - name: Remove runner SSH credentials
        if: ${{ always() }}
        shell: bash
        run: >-
          rm -f -- "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          "$HOME/.ssh/known_hosts.source" "$HOME/.ssh/config"
